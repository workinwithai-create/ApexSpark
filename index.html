<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ApexSpark — Next-Level Live Spark Desk</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div id="tap-overlay" class="overlay">Tap to start audio<br><small>iOS: silent switch mutes Web Audio</small></div>
  <header>
    <h1>ApexSpark</h1>
    <p>Apex-level four- or eight-bar live spark desk. Multi-chair step grids + recipes. Free.</p>
  </header>
  <div id="status">Loading…</div>
  <div class="controls">
    <label>BPM <input type="number" id="bpm" min="60" max="180" value="98"></label>
    <label>Key <select id="key">
      <option>A minor</option><option>C major</option><option>D minor</option><option>G major</option><option>E minor</option><option>F major</option>
    </select></label>
    <label>Chords <input type="text" id="chords" value="Am F C G" placeholder="Am F C G"></label>
    <label>Bars <select id="bars">
      <option value="4" selected>4</option><option value="8">8</option>
    </select></label>
    <label>Swing <input type="range" id="swing" min="0" max="60" value="0"> <span id="swing-val">0%</span></label>
  </div>
  <div class="mutes">
    <label><input type="checkbox" id="mute-kick" checked> Kick</label>
    <label><input type="checkbox" id="mute-snare" checked> Snare</label>
    <label><input type="checkbox" id="mute-hat" checked> Hat</label>
    <label><input type="checkbox" id="mute-bass" checked> Bass</label>
    <label><input type="checkbox" id="mute-piano" checked> Piano</label>
    <label><input type="checkbox" id="mute-guitar" checked> Guitar</label>
  </div>
  <div id="recipes" class="recipes"></div>
  <div id="bars" class="bars"></div>
  <div class="grids">
    <div><h3>Kick</h3><div id="grid-kick" class="grid"></div></div>
    <div><h3>Snare</h3><div id="grid-snare" class="grid"></div></div>
    <div><h3>Hat</h3><div id="grid-hat" class="grid"></div></div>
    <div><h3>Bass</h3><div id="grid-bass" class="grid"></div></div>
    <div><h3>Piano</h3><div id="grid-piano" class="grid"></div></div>
  </div>
  <div class="buttons">
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <button id="export-wav">Export WAV (folded)</button>
    <button id="export-tail">Export WAV (with tail)</button>
    <button id="export-midi">Export MIDI</button>
  </div>
  <pre id="punch"></pre>
  <script src="app.js"></script>
</body>
</html>
